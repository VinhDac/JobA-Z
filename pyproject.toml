[project]
name = "jobbot"
version = "1.0.0"
description = "A job-search management system — the person keeps every decision"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
