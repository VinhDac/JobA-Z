# Copy sang config/config.toml rồi điền. File thật đã bị gitignore.

[run]
# Cửa sổ được phép chạy với nguồn KHÔNG có API công khai (design.md §3).
# Nguồn có API công khai thì chạy 24/7 thoải mái, không đụng phần này.
human_window_start = "08:00"
human_window_end   = "22:00"

[sources.greenhouse]
enabled = true
boards  = []          # ví dụ: ["stripe", "figma"]

[sources.lever]
enabled = true
boards  = []          # ví dụ: ["spotify"]

[sources.ashby]
enabled = true
boards  = []

[scoring]
# Ngưỡng khởi điểm. Sẽ hiệu chỉnh bằng dữ liệu thật ở M9, không đoán.
apply_threshold = 0.75

[mail]
# HỘP THƯ RIÊNG cho việc làm, KHÔNG phải hộp thư chính.
#
# Vì sao riêng: app password của Google là chìa khoá TOÀN QUYỀN — đọc, gửi,
# xoá, cả hộp thư, tới khi thu hồi. Google không cho tạo loại chỉ-đọc. Chìa
# đó nằm dạng chữ ngay dưới đây. Đặt nó lên hộp thư chính là đặt sai chỗ;
# đặt lên một hộp chỉ chứa thư từ chối việc làm thì mất cũng chẳng sao.
#
# Lấy app password:
#   1. bật xác minh 2 bước cho tài khoản đó
#   2. myaccount.google.com/apppasswords  ->  tạo, đặt tên "jobbot"
#   3. dán chuỗi 16 ký tự vào dưới (KHÔNG phải mật khẩu tài khoản —
#      Gmail đã ngắt đăng nhập IMAP bằng mật khẩu tài khoản từ 2022)
#
# Tệp này đã nằm trong .gitignore.
address  = ""
password = ""

# MÁY CHỦ IMAP — để trống thì máy tự suy từ tên miền của địa chỉ trên.
#
# Gmail, Outlook, iCloud, Yahoo, Fastmail, Zoho, GMX, Yandex… đều có sẵn
# trong bảng; tên miền lạ thì thử `imap.<tên miền>`. Chỉ điền vào đây khi
# nhà cung cấp dùng địa chỉ khác, hoặc khi đó là hộp thư công ty.
#
# Proton thì BẮT BUỘC điền: Proton không nói IMAP ra ngoài Internet, phải
# cài Proton Mail Bridge rồi trỏ vào nó (host = "127.0.0.1", port = 1143).
host = ""
port = 993
