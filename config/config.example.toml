# Copy this to config/config.toml and fill it in. The real file is gitignored.

[run]
# The window in which sources WITHOUT a public API are allowed to run (design.md §3).
# Sources with a public API run happily 24/7 and never touch this section.
human_window_start = "08:00"
human_window_end   = "22:00"

[sources.greenhouse]
enabled = true
boards  = []          # for example: ["stripe", "figma"]

[sources.lever]
enabled = true
boards  = []          # for example: ["spotify"]

[sources.ashby]
enabled = true
boards  = []

[scoring]
# A starting threshold. It will be calibrated against real data at M9, never guessed.
apply_threshold = 0.75

[mail]
# A MAILBOX OF ITS OWN for job hunting, NOT your main mailbox.
#
# Why separate: a Google app password is a FULL-POWER key — read, send, delete,
# the whole mailbox, until it is revoked. Google offers no read-only kind. That
# key sits here in plain text. Putting it on your main mailbox is putting it in
# the wrong place; putting it on a mailbox holding nothing but job rejections
# means losing it costs nothing.
#
# To get an app password:
#   1. turn on 2-step verification for that account
#   2. myaccount.google.com/apppasswords  ->  create one, name it "jobbot"
#   3. paste the 16-character string below (NOT the account password —
#      Gmail stopped accepting the account password for IMAP in 2022)
#
# This file is already in .gitignore.
address  = ""
password = ""

# THE IMAP SERVER — leave it empty and the machine works it out from the domain
# of the address above.
#
# Gmail, Outlook, iCloud, Yahoo, Fastmail, Zoho, GMX, Yandex… are all in the
# table; an unknown domain is tried as `imap.<domain>`. Fill this in only when
# the provider uses a different address, or when this is a company mailbox.
#
# Proton MUST be filled in: Proton does not speak IMAP out to the internet, so
# you install Proton Mail Bridge and point at it (host = "127.0.0.1", port = 1143).
host = ""
port = 993
